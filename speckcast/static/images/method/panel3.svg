<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" font-family="'Google Sans', 'Noto Sans', Arial, Helvetica, sans-serif" role="img" aria-labelledby="sk3t sk3d">
<title id="sk3t">3. Uncertainty-aware scheduling</title>
<desc id="sk3d">Schematic. The forecast uncertainty (risk) grows over skipped steps. The transformer runs at the first step whose risk exceeds the threshold (each orange dot sits just above the dashed line), which resets the risk; the threshold is set per compute budget. The first 3 steps and the last step always run. The strip shows the resulting schedule: orange steps run the transformer, blue steps are forecast.</desc>
