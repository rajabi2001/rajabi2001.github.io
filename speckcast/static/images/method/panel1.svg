<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" font-family="'Google Sans', 'Noto Sans', Arial, Helvetica, sans-serif" role="img" aria-labelledby="sk1t sk1d">
<title id="sk1t">1. Spatial-frequency decomposition</title>
<desc id="sk1d">Schematic. At computed steps the denoiser output goes through an orthonormal 2D DCT, per channel, and the frequency plane is split into 7 radial bands from low to high frequency. Each coefficient is forecast as its own time series. At skipped steps the forecast coefficients go through the inverse DCT and the forecast output goes to the sampler.</desc>
